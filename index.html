    <!-- JAVASCRIPT APPLICATION LOGIC (PEERJS P2P)  -->
    <!-- ========================================== -->
    <script>
        // Callback global exigida pela YouTube IFrame Player API
        window.ytApiReady = false;
        window.onYouTubeIframeAPIReady = function () {
            window.ytApiReady = true;
        };

        /**
         * CineSync - Aplicação de Sala de Cinema Sincronizada
         * Arquitetura Peer-to-Peer Real com PeerJS (WebRTC DataChannels + MediaStream)
         * + Busca Integrada do YouTube (Piped / Invidious APIs) e Player YouTube Sincronizado.
         */
        document.addEventListener('DOMContentLoaded', () => {
            // Inicializa ícones Lucide
            lucide.createIcons();

            // Constante de limite máximo: 5 GB em bytes
            const MAX_FILE_SIZE_BYTES = 5 * 1024 * 1024 * 1024; // 5.368.709.120 bytes
            const PEER_PREFIX = 'cinesync-v2-room-';

            // Instâncias públicas para busca no YouTube compatíveis com navegador (CORS habilitado)
            const PIPED_INSTANCES = [
                'https://pipedapi.kavin.rocks',
                'https://pipedapi.adminforge.de',
                'https://api.piped.private.coffee',
                'https://pipedapi.leptons.xyz'
            ];

            const INVIDIOUS_INSTANCES = [
                'https://inv.nadeko.net',
                'https://invidious.nerdvpn.de',
                'https://invidious.privacyredirect.com'
            ];

            // Configuração de servidores STUN públicos gratuitos para atravessar NAT/Roteadores
            const PEER_CONFIG = {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:global.stun.twilio.com:3478' }
                    ]
                }
            };

            // Estado da Aplicação (In-Memory)
            const state = {
                roomCode: null,
                role: null, // 'host' | 'guest'
                username: 'Espectador',
                peer: null,
                hostConnection: null, // DataConnection usada pelo Guest para falar com o Host
                guestConnections: new Map(), // Map<peerId, { conn, call, username }> usado pelo Host
                participants: new Map(), // Map<peerId, { username, role }>
                mediaMode: 'none', // 'none' | 'local' | 'youtube'
                currentVideoUrl: null,
                currentFileName: null,
                currentFileSize: 0,
                youtubeVideoId: null,
                youtubeTitle: null,
                ytPlayer: null,
                ytProgressTimer: null,
                guestUsingLocalFile: false, // Se o convidado optou por carregar arquivo local
                activeMediaCall: null,
                syncInterval: null
            };

            // Referências DOM - Lobby
// ... existing code ... -->
            // Referências DOM - Upload & Player
            const hostUploadPanel = document.getElementById('host-upload-panel');
            const ytSearchForm = document.getElementById('yt-search-form');
            const ytSearchInput = document.getElementById('yt-search-input');
            const btnClearYtSearch = document.getElementById('btn-clear-yt-search');
            const btnYtSearch = document.getElementById('btn-yt-search');
            const ytResultsDrawer = document.getElementById('yt-results-drawer');
            const ytResultsTitle = document.getElementById('yt-results-title');
            const ytResultsGrid = document.getElementById('yt-results-grid');
            const btnCloseYtResults = document.getElementById('btn-close-yt-results');

            const guestStatusBanner = document.getElementById('guest-status-banner');
            const guestBannerIcon = document.getElementById('guest-banner-icon');
            const guestBannerText = document.getElementById('guest-banner-text');
            const guestFileBadge = document.getElementById('guest-file-badge');
            const guestLocalUploadWrapper = document.getElementById('guest-local-upload-wrapper');
            const guestLocalFileInput = document.getElementById('guest-local-file-input');
            const guestLocalLabel = document.getElementById('guest-local-label');
            const videoFileInput = document.getElementById('video-file-input');
            const uploadBtnLabel = document.getElementById('upload-btn-label');
            const fileInfoText = document.getElementById('file-info-text');

            const playerWrapper = document.getElementById('player-wrapper');
            const videoPlaceholder = document.getElementById('video-placeholder');
            const placeholderTitle = document.getElementById('placeholder-title');
            const placeholderSubtitle = document.getElementById('placeholder-subtitle');
            const videoEl = document.getElementById('cinema-video');
            const youtubeStage = document.getElementById('youtube-stage');
            const ytClickShield = document.getElementById('yt-click-shield');
            const videoSyncPill = document.getElementById('video-sync-pill');
            const videoSyncDot = document.getElementById('video-sync-dot');
            const videoSyncText = document.getElementById('video-sync-text');
            const customControls = document.getElementById('custom-controls');

            // Controles do Player
// ... existing code ... -->
            /**
             * Inicia chamada de mídia WebRTC do Host para um Convidado específico
             */
            function streamVideoToGuest(guestPeerId) {
                if (state.role !== 'host' || !state.peer || state.mediaMode !== 'local' || !state.currentVideoUrl) return;
                
                const stream = getHostVideoStream();
                if (!stream) {
                    showToast('Aviso de Transmissão', 'Seu navegador restringiu a captura direta de stream. Os convidados ainda podem usar o modo arquivo local.', 'warning');
                    return;
                }

                const guestEntry = state.guestConnections.get(guestPeerId);
                if (guestEntry && guestEntry.call) {
                    try { guestEntry.call.close(); } catch (e) {}
                }

                const call = state.peer.call(guestPeerId, stream, {
                    metadata: {
                        fileName: state.currentFileName,
                        fileSize: state.currentFileSize
                    }
                });

                if (guestEntry) {
                    guestEntry.call = call;
                }
            }

            /**
             * Transmite o vídeo ativo para TODOS os convidados conectados na sala
             */
            function streamVideoToAllGuests() {
                if (state.role !== 'host' || state.mediaMode !== 'local' || !state.currentVideoUrl) return;
                state.guestConnections.forEach((_, guestPeerId) => {
                    streamVideoToGuest(guestPeerId);
                });
            }

            // ==========================================
            // PESQUISA YOUTUBE & PLAYER SINCRONIZADO
            // ==========================================

            /**
             * Extrai o ID de 11 caracteres de links do YouTube (watch, youtu.be, shorts, embed) ou ID direto
             */
            function extractYouTubeId(input) {
                if (!input) return null;
                const trimmed = input.trim();
                if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) {
                    return trimmed;
                }
                const patterns = [
                    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,
                    /[?&]v=([a-zA-Z0-9_-]{11})/
                ];
                for (const regex of patterns) {
                    const match = trimmed.match(regex);
                    if (match && match[1]) return match[1];
                }
                return null;
            }

            function formatViews(views) {
                if (!views || isNaN(views)) return '';
                if (views >= 1000000) return (views / 1000000).toFixed(1).replace('.0', '') + ' mi de visualizações';
                if (views >= 1000) return Math.floor(views / 1000) + ' mil visualizações';
                return views + ' visualizações';
            }

            /**
             * Busca vídeos no YouTube usando APIs públicas (Piped com fallback para Invidious)
             */
            async function searchYouTubeVideos(query) {
                const directId = extractYouTubeId(query);
                ytResultsDrawer.classList.remove('hidden');
                ytResultsTitle.textContent = `Buscando "${query}" no YouTube...`;
                ytResultsGrid.innerHTML = `
                    <div class="col-span-full py-8 flex flex-col items-center justify-center text-gray-400 gap-2">
                        <i data-lucide="loader-2" class="w-6 h-6 text-rose-500 animate-spin"></i>
                        <span class="text-xs">Pesquisando vídeos relacionados...</span>
                    </div>
                `;
                lucide.createIcons({ root: ytResultsGrid });

                // Se o usuário colou um link direto ou ID do YouTube, exibe o card imediato além de tentar buscar detalhes
                if (directId) {
                    renderYouTubeResults([{
                        videoId: directId,
                        title: `Vídeo do YouTube (${directId})`,
                        channel: 'Link Direto do YouTube',
                        duration: null,
                        views: null,
                        thumbnail: `https://i.ytimg.com/vi/${directId}/hqdefault.jpg`
                    }], `Vídeo encontrado pelo link`);
                    return;
                }

                // 1. Tenta instâncias Piped API
                for (const baseUrl of PIPED_INSTANCES) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 5500);
                        const res = await fetch(`${baseUrl}/search?q=${encodeURIComponent(query)}&filter=videos`, {
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);

                        if (!res.ok) continue;
                        const data = await res.json();
                        const items = (data.items || [])
                            .filter(item => item.type === 'stream' && item.url)
                            .map(item => {
                                const vid = extractYouTubeId(item.url);
                                return {
                                    videoId: vid,
                                    title: item.title || 'Sem título',
                                    channel: item.uploaderName || 'Canal do YouTube',
                                    duration: item.duration > 0 ? formatTime(item.duration) : 'AO VIVO',
                                    views: item.views,
                                    thumbnail: item.thumbnail || (vid ? `https://i.ytimg.com/vi/${vid}/hqdefault.jpg` : '')
                                };
                            })
                            .filter(v => v.videoId);

                        if (items.length > 0) {
                            renderYouTubeResults(items.slice(0, 12), `Resultados para "${query}"`);
                            return;
                        }
                    } catch (err) {
                        // Continua para a próxima instância
                    }
                }

                // 2. Fallback para instâncias Invidious API
                for (const baseUrl of INVIDIOUS_INSTANCES) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 5500);
                        const res = await fetch(`${baseUrl}/api/v1/search?q=${encodeURIComponent(query)}&type=video`, {
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);

                        if (!res.ok) continue;
                        const data = await res.json();
                        const items = (Array.isArray(data) ? data : [])
                            .filter(item => item.videoId)
                            .map(item => ({
                                videoId: item.videoId,
                                title: item.title || 'Sem título',
                                channel: item.author || 'Canal do YouTube',
                                duration: item.lengthSeconds > 0 ? formatTime(item.lengthSeconds) : 'AO VIVO',
                                views: item.viewCount,
                                thumbnail: `https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg`
                            }));

                        if (items.length > 0) {
                            renderYouTubeResults(items.slice(0, 12), `Resultados para "${query}"`);
                            return;
                        }
                    } catch (err) {
                        // Continua para a próxima instância
                    }
                }

                // Caso todas as APIs públicas estejam temporariamente bloqueadas pela rede
                ytResultsTitle.textContent = 'Busca indisponível no momento';
                ytResultsGrid.innerHTML = `
                    <div class="col-span-full p-4 bg-cinema-950 border border-cinema-800 rounded-xl text-center">
                        <p class="text-xs text-gray-300 mb-1">Não foi possível consultar os servidores de busca agora.</p>
                        <p class="text-[11px] text-gray-500">Dica: Você pode colar qualquer <strong>link do YouTube</strong> (ex: <span class="text-gray-400 font-mono">https://youtu.be/...</span>) diretamente na barra acima!</p>
                    </div>
                `;
            }

            /**
             * Renderiza o menu/grade de resultados do YouTube
             */
            function renderYouTubeResults(videos, headingText) {
                ytResultsTitle.textContent = headingText;
                ytResultsGrid.innerHTML = '';

                videos.forEach(video => {
                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = 'group text-left bg-cinema-950 hover:bg-cinema-800/90 border border-cinema-800 hover:border-rose-500/60 rounded-xl p-2 flex gap-3 transition-all active:scale-[0.99]';
                    
                    const durationBadge = video.duration
                        ? `<span class="absolute bottom-1 right-1 bg-black/85 text-white text-[10px] font-mono px-1.5 py-0.5 rounded">${escapeHtml(video.duration)}</span>`
                        : '';
                    const viewsText = video.views ? ` • ${formatViews(video.views)}` : '';

                    card.innerHTML = `
                        <div class="relative w-28 sm:w-32 aspect-video rounded-lg overflow-hidden bg-black shrink-0 border border-cinema-800">
                            <img src="${video.thumbnail}" alt="${escapeHtml(video.title)}" onerror="this.src='https://placehold.co/320x180/161821/e11d48?text=YouTube'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            ${durationBadge}
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col justify-between py-0.5">
                            <h5 class="text-xs font-semibold text-gray-100 group-hover:text-rose-400 line-clamp-2 leading-snug transition-colors">${escapeHtml(video.title)}</h5>
                            <div class="mt-1">
                                <p class="text-[11px] text-gray-400 truncate">${escapeHtml(video.channel)}</p>
                                <p class="text-[10px] text-gray-500 truncate">${escapeHtml(viewsText.replace(/^ • /, ''))}</p>
                            </div>
                        </div>
                    `;

                    card.addEventListener('click', () => {
                        selectYouTubeVideo(video.videoId, video.title);
                    });

                    ytResultsGrid.appendChild(card);
                });
            }

            /**
             * Seleciona e inicia um vídeo do YouTube para o Host e transmite o comando para todos os Convidados
             */
            function selectYouTubeVideo(videoId, title) {
                if (state.role !== 'host') return;

                // Encerra eventual stream local anterior
                if (state.currentVideoUrl) {
                    URL.revokeObjectURL(state.currentVideoUrl);
                    state.currentVideoUrl = null;
                }
                state.guestConnections.forEach((entry) => {
                    if (entry.call) {
                        try { entry.call.close(); } catch (e) {}
                        entry.call = null;
                    }
                });

                state.mediaMode = 'youtube';
                state.youtubeVideoId = videoId;
                state.youtubeTitle = title || `YouTube (${videoId})`;
                state.currentFileName = state.youtubeTitle;
                state.currentFileSize = 0;

                ytResultsDrawer.classList.add('hidden');
                fileInfoText.innerHTML = `YouTube ativo: <strong class="text-rose-400">${escapeHtml(state.youtubeTitle)}</strong>`;

                loadYouTubeIntoPlayer(videoId, state.youtubeTitle, 0, true);

                // Sincroniza com todos os convidados da sala
                broadcastToGuests({
                    type: 'LOAD_YOUTUBE',
                    videoId: videoId,
                    title: state.youtubeTitle,
                    currentTime: 0,
                    autoplay: true
                });

                addSystemMessage(`Você iniciou o vídeo do YouTube: "${state.youtubeTitle}".`);
                showToast('YouTube Carregado!', 'O vídeo foi iniciado para você e todos os convidados da sala.', 'success');
            }

            /**
             * Monta ou atualiza o YouTube IFrame Player sincronizado no palco
             */
            function loadYouTubeIntoPlayer(videoId, title, startSeconds = 0, autoplay = true) {
                // Oculta player HTML5 local e placeholder
                videoEl.pause();
                videoEl.srcObject = null;
                videoEl.removeAttribute('src');
                videoEl.classList.add('hidden');
                videoPlaceholder.classList.add('hidden');

                // Exibe palco do YouTube e controles customizados sincronizados
                youtubeStage.classList.remove('hidden');
                customControls.classList.remove('hidden');
                activeMediaFooter.classList.remove('hidden');

                activeFileName.textContent = title || `YouTube (${videoId})`;
                activeFileSize.textContent = 'YouTube HD';
                syncModeText.textContent = state.role === 'host' ? 'YouTube Sincronizado (Host)' : 'YouTube Sincronizado com o Host';

                if (state.role === 'guest') {
                    guestFileBadge.textContent = title || 'YouTube';
                    guestFileBadge.classList.remove('hidden');
                    guestLocalUploadWrapper.classList.add('hidden');
                    updateGuestBanner('streaming', `Assistindo vídeo do YouTube sincronizado com o <strong>Host</strong>.`);
                    updateVideoSyncOverlay('synced', 'Sincronizado com o Host');
                }

                const initOrLoad = () => {
                    if (state.ytPlayer && typeof state.ytPlayer.loadVideoById === 'function') {
                        if (autoplay) {
                            state.ytPlayer.loadVideoById({ videoId, startSeconds });
                            updatePlayPauseUI(false);
                        } else {
                            state.ytPlayer.cueVideoById({ videoId, startSeconds });
                            updatePlayPauseUI(true);
                        }
                        return;
                    }

                    // Recria o container interno para o YT.Player substituir pelo iframe
                    youtubeStage.innerHTML = `
                        <div id="yt-player-mount" class="w-full h-full"></div>
                        <div id="yt-click-shield" class="absolute inset-0 z-10 cursor-pointer"></div>
                    `;
                    document.getElementById('yt-click-shield').addEventListener('click', () => {
                        if (state.role === 'host') {
                            btnPlayPause.click();
                        }
                    });

                    state.ytPlayer = new YT.Player('yt-player-mount', {
                        width: '100%',
                        height: '100%',
                        videoId: videoId,
                        playerVars: {
                            autoplay: autoplay ? 1 : 0,
                            controls: 0,
                            disablekb: 1,
                            modestbranding: 1,
                            rel: 0,
                            playsinline: 1,
                            start: Math.floor(startSeconds),
                            origin: window.location.origin
                        },
                        events: {
                            onReady: (event) => {
                                const vol = Math.round(parseFloat(volumeBar.value) * 100);
                                event.target.setVolume(vol);
                                if (autoplay) {
                                    event.target.playVideo();
                                    updatePlayPauseUI(false);
                                }
                                startYouTubeProgressTracker();
                            },
                            onStateChange: (event) => {
                                // YT.PlayerState: PLAYING = 1, PAUSED = 2, ENDED = 0
                                if (event.data === 1) {
                                    updatePlayPauseUI(false);
                                    const dur = state.ytPlayer.getDuration ? state.ytPlayer.getDuration() : 0;
                                    if (dur > 0) timeDuration.textContent = formatTime(dur);
                                } else if (event.data === 2) {
                                    updatePlayPauseUI(true);
                                } else if (event.data === 0) {
                                    updatePlayPauseUI(true);
                                    if (state.role === 'host') {
                                        broadcastToGuests({ type: 'VIDEO_PAUSE', currentTime: state.ytPlayer.getDuration() || 0 });
                                    }
                                }
                            }
                        }
                    });
                };

                if (window.ytApiReady && typeof YT !== 'undefined' && YT.Player) {
                    initOrLoad();
                } else {
                    const waitYt = setInterval(() => {
                        if (window.ytApiReady && typeof YT !== 'undefined' && YT.Player) {
                            clearInterval(waitYt);
                            initOrLoad();
                        }
                    }, 200);
                }
            }

            /**
             * Atualiza continuamente a barra de tempo enquanto o player do YouTube está ativo
             */
            function startYouTubeProgressTracker() {
                if (state.ytProgressTimer) clearInterval(state.ytProgressTimer);
                state.ytProgressTimer = setInterval(() => {
                    if (state.mediaMode !== 'youtube' || !state.ytPlayer || typeof state.ytPlayer.getCurrentTime !== 'function') return;
                    const curr = state.ytPlayer.getCurrentTime() || 0;
                    const dur = state.ytPlayer.getDuration() || 0;
                    if (dur > 0) {
                        seekBar.value = (curr / dur) * 100;
                        timeCurrent.textContent = formatTime(curr);
                        timeDuration.textContent = formatTime(dur);
                    }
                }, 400);
            }

            function destroyYouTubePlayer() {
                if (state.ytProgressTimer) {
                    clearInterval(state.ytProgressTimer);
                    state.ytProgressTimer = null;
                }
                if (state.ytPlayer && typeof state.ytPlayer.destroy === 'function') {
                    try { state.ytPlayer.destroy(); } catch (e) {}
                }
                state.ytPlayer = null;
                youtubeStage.classList.add('hidden');
            }

            // ==========================================
            // GERENCIAMENTO DE SALA & PEERJS (HOST / GUEST)
            // ==========================================

            function enterRoom(code, role) {
                if (typeof Peer === 'undefined') {
                    showToast('Erro de Rede', 'A biblioteca PeerJS não pôde ser carregada. Verifique sua conexão com a internet.', 'error');
                    return;
                }

                const rawName = usernameInput.value.trim();
                state.username = rawName || (role === 'host' ? 'Anfitrião' : 'Convidado_' + Math.floor(Math.random() * 900 + 100));
                state.roomCode = code.toUpperCase();
                state.role = role;
                state.mediaMode = 'none';
                state.guestConnections.clear();
                state.participants.clear();
                state.guestUsingLocalFile = false;

                // Alterna telas
                lobbyView.classList.add('hidden');
                roomView.classList.remove('hidden');

                // Atualiza UI do Header
                displayRoomCode.textContent = state.roomCode;
                setNetworkStatus('connecting', 'Conectando à rede P2P...');

                if (role === 'host') {
                    roleBadge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/15 border border-rose-500/30 text-rose-400';
                    roleBadge.innerHTML = `<i data-lucide="crown" class="w-3.5 h-3.5"></i> Host (Anfitrião)`;
                    
                    hostUploadPanel.classList.remove('hidden');
                    guestStatusBanner.classList.add('hidden');
                    videoSyncPill.classList.add('hidden');
                    btnForceSync.classList.remove('hidden');
                    btnForceSync.classList.add('inline-flex');
                    btnReconnect.classList.add('hidden');

                    // Habilita controles de reprodução do Host
                    btnPlayPause.disabled = false;
                    btnRewind.disabled = false;
                    btnForward.disabled = false;
                    seekBar.disabled = false;
                    lockedControlsHint.classList.add('hidden');

                    placeholderTitle.textContent = 'Sua sala está pronta!';
                    placeholderSubtitle.textContent = 'Pesquise um vídeo no YouTube ou importe um arquivo local (até 5 GB) acima para iniciar.';
                    
                    initHostPeer();
                } else {
                    roleBadge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/15 border border-indigo-500/30 text-indigo-300';
                    roleBadge.innerHTML = `<i data-lucide="eye" class="w-3.5 h-3.5"></i> Convidado`;
                    
                    hostUploadPanel.classList.add('hidden');
                    guestStatusBanner.classList.remove('hidden');
                    guestLocalUploadWrapper.classList.remove('hidden');
                    videoSyncPill.classList.remove('hidden');
                    btnForceSync.classList.add('hidden');
                    btnReconnect.classList.add('hidden');

                    // Bloqueia controles de reprodução para o Convidado
                    btnPlayPause.disabled = true;
                    btnRewind.disabled = true;
                    btnForward.disabled = true;
                    seekBar.disabled = true;
                    lockedControlsHint.classList.remove('hidden');
                    lockedControlsHint.classList.add('inline-flex');

                    updateGuestBanner('connecting', `Conectando ao Host da sala <strong>${state.roomCode}</strong>...`);
                    updateVideoSyncOverlay('waiting', 'Conectando ao Host...');
                    placeholderTitle.textContent = 'Conectando à sala do Host...';
                    placeholderSubtitle.textContent = 'Aguarde alguns segundos enquanto estabelecemos a conexão direta P2P.';

                    initGuestPeer();
                }

                lucide.createIcons();
            }

            /**
             * Inicializa o nó PeerJS do HOST com ID determinístico baseado no código da sala
             */
            function initHostPeer() {
// ... existing code ... -->
                // Heartbeat periódico (a cada 3s) para manter o relógio dos convidados perfeitamente alinhado
                if (state.syncInterval) clearInterval(state.syncInterval);
                state.syncInterval = setInterval(() => {
                    if (state.role !== 'host' || state.guestConnections.size === 0) return;

                    if (state.mediaMode === 'local' && state.currentVideoUrl) {
                        broadcastToGuests({
                            type: 'SYNC_HEARTBEAT',
                            mediaMode: 'local',
                            currentTime: videoEl.currentTime,
                            duration: videoEl.duration || 0,
                            paused: videoEl.paused
                        });
                    } else if (state.mediaMode === 'youtube' && state.ytPlayer && typeof state.ytPlayer.getCurrentTime === 'function') {
                        const ytState = state.ytPlayer.getPlayerState ? state.ytPlayer.getPlayerState() : 2;
                        broadcastToGuests({
                            type: 'SYNC_HEARTBEAT',
                            mediaMode: 'youtube',
                            currentTime: state.ytPlayer.getCurrentTime() || 0,
                            duration: state.ytPlayer.getDuration() || 0,
                            paused: ytState !== 1
                        });
                    }
                }, 3000);
            }

            /**
             * Processa mensagens recebidas pelo HOST e retransmite para o grupo
             */
            function handleHostReceiveData(conn, data) {
                if (!data || !data.type) return;

                switch (data.type) {
                    case 'JOIN':
                        const guestName = data.username || 'Convidado';
                        state.guestConnections.set(conn.peer, { conn, call: null, username: guestName });
                        state.participants.set(conn.peer, { username: guestName, role: 'guest' });
                        updateParticipantsUI();

                        const joinText = `${guestName} entrou na sala.`;
                        addSystemMessage(joinText);
                        
                        // Avisa todos os outros convidados e atualiza lista de participantes
                        broadcastToGuests({ type: 'SYSTEM_MSG', text: joinText }, conn.peer);
                        broadcastParticipantsList();

                        // Envia confirmação de boas-vindas + metadados da mídia ativa (YouTube ou Vídeo Local)
                        if (state.mediaMode === 'youtube' && state.youtubeVideoId) {
                            const curr = state.ytPlayer && state.ytPlayer.getCurrentTime ? state.ytPlayer.getCurrentTime() : 0;
                            const ytState = state.ytPlayer && state.ytPlayer.getPlayerState ? state.ytPlayer.getPlayerState() : 1;
                            conn.send({
                                type: 'WELCOME',
                                hostName: state.username,
                                mediaMode: 'youtube',
                                youtubeVideoId: state.youtubeVideoId,
                                youtubeTitle: state.youtubeTitle,
                                currentTime: curr,
                                paused: ytState !== 1
                            });
                        } else {
                            conn.send({
                                type: 'WELCOME',
                                hostName: state.username,
                                mediaMode: state.mediaMode,
                                hasVideo: Boolean(state.currentVideoUrl),
                                fileName: state.currentFileName,
                                fileSize: state.currentFileSize,
                                currentTime: videoEl.currentTime || 0,
                                paused: videoEl.paused
                            });

                            // Se já existe um vídeo local carregado pelo Host, inicia o stream WebRTC imediatamente!
                            if (state.mediaMode === 'local' && state.currentVideoUrl) {
                                setTimeout(() => streamVideoToGuest(conn.peer), 400);
                            }
                        }
                        break;

                    case 'REQUEST_STREAM':
                        if (state.mediaMode === 'local' && state.currentVideoUrl) {
                            streamVideoToGuest(conn.peer);
                        }
                        break;

                    case 'CHAT_MESSAGE':
                        // Exibe no chat do Host e retransmite para TODOS os convidados
                        appendChatMessage(data.username, 'guest', data.text, false);
                        broadcastToGuests({
                            type: 'CHAT_MESSAGE',
                            senderId: conn.peer,
                            username: data.username,
                            role: 'guest',
                            text: data.text
                        }, conn.peer);
                        break;
                }
            }

            /**
             * Envia dados do Host para todos os convidados conectados (opcionalmente ignorando um peerId)
             */
// ... existing code ... -->
            /**
             * Processa comandos de controle, sincronização e chat recebidos pelo CONVIDADO
             */
            function handleGuestReceiveData(data) {
                if (!data || !data.type) return;

                switch (data.type) {
                    case 'WELCOME':
                        addSystemMessage(`Conectado à sala de ${data.hostName}!`);
                        if (data.mediaMode === 'youtube' && data.youtubeVideoId) {
                            state.mediaMode = 'youtube';
                            state.youtubeVideoId = data.youtubeVideoId;
                            state.youtubeTitle = data.youtubeTitle;
                            loadYouTubeIntoPlayer(data.youtubeVideoId, data.youtubeTitle, data.currentTime || 0, !data.paused);
                        } else if (data.hasVideo) {
                            state.mediaMode = 'local';
                            state.currentFileName = data.fileName;
                            state.currentFileSize = data.fileSize;
                            guestFileBadge.textContent = data.fileName;
                            guestFileBadge.classList.remove('hidden');
                            guestLocalUploadWrapper.classList.remove('hidden');
                            activeFileName.textContent = data.fileName;
                            activeFileSize.textContent = formatBytes(data.fileSize);

                            updateGuestBanner('connecting', `Recebendo vídeo <strong>"${data.fileName}"</strong> do Host...`);
                            updateVideoSyncOverlay('waiting', 'Recebendo transmissão...');
                            placeholderTitle.textContent = 'Carregando transmissão do Host...';
                            placeholderSubtitle.textContent = `O Host está exibindo "${data.fileName}". O vídeo iniciará em instantes.`;
                        } else {
                            updateGuestBanner('connected', 'Conectado! Aguardando o <strong>Host</strong> escolher um vídeo.');
                            updateVideoSyncOverlay('waiting', 'Aguardando vídeo do Host');
                            placeholderTitle.textContent = 'Conectado à sala!';
                            placeholderSubtitle.textContent = 'Aguardando o Host selecionar um vídeo do YouTube ou arquivo local.';
                        }
                        break;

                    case 'LOAD_YOUTUBE':
                        state.mediaMode = 'youtube';
                        state.guestUsingLocalFile = false;
                        state.youtubeVideoId = data.videoId;
                        state.youtubeTitle = data.title;
                        loadYouTubeIntoPlayer(data.videoId, data.title, data.currentTime || 0, data.autoplay !== false);
                        addSystemMessage(`O Host iniciou o vídeo do YouTube: "${data.title}".`);
                        break;

                    case 'VIDEO_LOADED':
                        destroyYouTubePlayer();
                        state.mediaMode = 'local';
                        state.currentFileName = data.fileName;
                        state.currentFileSize = data.fileSize;
                        guestFileBadge.textContent = data.fileName;
                        guestFileBadge.classList.remove('hidden');
                        guestLocalUploadWrapper.classList.remove('hidden');
                        activeFileName.textContent = data.fileName;
                        activeFileSize.textContent = formatBytes(data.fileSize);
                        
                        addSystemMessage(`O Host carregou "${data.fileName}" (${formatBytes(data.fileSize)}).`);
                        if (!state.guestUsingLocalFile) {
                            updateGuestBanner('connecting', `O Host carregou <strong>"${data.fileName}"</strong>. Iniciando transmissão...`);
                            updateVideoSyncOverlay('waiting', 'Iniciando transmissão...');
                        }
                        break;

                    case 'VIDEO_PLAY':
                        if (state.mediaMode === 'youtube' && state.ytPlayer && typeof state.ytPlayer.playVideo === 'function') {
                            const curr = state.ytPlayer.getCurrentTime ? state.ytPlayer.getCurrentTime() : 0;
                            if (typeof data.currentTime === 'number' && Math.abs(curr - data.currentTime) > 1.0) {
                                state.ytPlayer.seekTo(data.currentTime, true);
                            }
                            state.ytPlayer.playVideo();
                            updatePlayPauseUI(false);
                            updateVideoSyncOverlay('synced', 'Sincronizado com o Host');
                        } else if (videoEl.src || videoEl.srcObject) {
                            if (state.guestUsingLocalFile && Math.abs(videoEl.currentTime - data.currentTime) > 0.6) {
                                videoEl.currentTime = data.currentTime;
                            }
                            videoEl.play().catch(() => {});
                            updatePlayPauseUI(false);
                            updateVideoSyncOverlay('synced', 'Sincronizado com o Host');
                        }
                        break;

                    case 'VIDEO_PAUSE':
                        if (state.mediaMode === 'youtube' && state.ytPlayer && typeof state.ytPlayer.pauseVideo === 'function') {
                            state.ytPlayer.pauseVideo();
                            if (typeof data.currentTime === 'number') {
                                state.ytPlayer.seekTo(data.currentTime, true);
                            }
                            updatePlayPauseUI(true);
                            updateVideoSyncOverlay('synced', 'Pausado pelo Host');
                        } else if (videoEl.src || videoEl.srcObject) {
                            videoEl.pause();
                            if (state.guestUsingLocalFile) {
                                videoEl.currentTime = data.currentTime;
                            }
                            updatePlayPauseUI(true);
                            updateVideoSyncOverlay('synced', 'Pausado pelo Host');
                        }
                        break;

                    case 'VIDEO_SEEK':
                        if (state.mediaMode === 'youtube' && state.ytPlayer && typeof state.ytPlayer.seekTo === 'function') {
                            state.ytPlayer.seekTo(data.currentTime, true);
                            updateVideoSyncOverlay('synced', 'Sincronizado com o Host');
                        } else if (state.guestUsingLocalFile && videoEl.src) {
                            videoEl.currentTime = data.currentTime;
                            updateVideoSyncOverlay('synced', 'Sincronizado com o Host');
                        }
                        break;

                    case 'SYNC_HEARTBEAT':
                        if (data.mediaMode === 'youtube' && state.mediaMode === 'youtube' && state.ytPlayer && typeof state.ytPlayer.getCurrentTime === 'function') {
                            const curr = state.ytPlayer.getCurrentTime() || 0;
                            if (Math.abs(curr - data.currentTime) > 1.8) {
                                state.ytPlayer.seekTo(data.currentTime, true);
                            }
                            const ytState = state.ytPlayer.getPlayerState ? state.ytPlayer.getPlayerState() : 2;
                            if (data.paused && ytState === 1) {
                                state.ytPlayer.pauseVideo();
                                updatePlayPauseUI(true);
                            } else if (!data.paused && ytState !== 1) {
                                state.ytPlayer.playVideo();
                                updatePlayPauseUI(false);
                            }
                            break;
                        }

                        // Atualiza duração e barra visual mesmo no modo stream
                        if (data.duration && !state.guestUsingLocalFile && state.mediaMode === 'local') {
                            timeCurrent.textContent = formatTime(data.currentTime);
                            timeDuration.textContent = formatTime(data.duration);
                            seekBar.value = (data.currentTime / data.duration) * 100;
                        }
                        if (state.guestUsingLocalFile && videoEl.src) {
                            if (Math.abs(videoEl.currentTime - data.currentTime) > 1.2) {
                                videoEl.currentTime = data.currentTime;
                            }
                            if (data.paused && !videoEl.paused) {
                                videoEl.pause();
                                updatePlayPauseUI(true);
                            } else if (!data.paused && videoEl.paused) {
                                videoEl.play().catch(() => {});
                                updatePlayPauseUI(false);
                            }
                        }
                        break;

                    case 'CHAT_MESSAGE':
                        appendChatMessage(data.username, data.role, data.text, false);
                        break;

                    case 'SYSTEM_MSG':
                        addSystemMessage(data.text);
                        break;

                    case 'PARTICIPANTS_UPDATE':
                        if (Array.isArray(data.list)) {
                            viewerCountEl.textContent = Math.max(1, data.list.length);
                            const names = data.list.map(p => `${p.username}${p.role === 'host' ? ' (Host)' : ''}`).join(', ');
                            viewersPill.title = `Na sala: ${names}`;
                        }
                        break;
                }
            }

            function leaveRoom() {
                if (state.syncInterval) {
                    clearInterval(state.syncInterval);
                    state.syncInterval = null;
                }
                destroyYouTubePlayer();
                if (state.activeMediaCall) {
                    try { state.activeMediaCall.close(); } catch (e) {}
                    state.activeMediaCall = null;
                }
                if (state.hostConnection) {
                    try { state.hostConnection.close(); } catch (e) {}
                    state.hostConnection = null;
                }
                state.guestConnections.forEach((entry) => {
                    try { if (entry.call) entry.call.close(); } catch (e) {}
                    try { if (entry.conn) entry.conn.close(); } catch (e) {}
                });
                state.guestConnections.clear();

                if (state.peer) {
                    try { state.peer.destroy(); } catch (e) {}
                    state.peer = null;
                }
                if (state.currentVideoUrl) {
                    URL.revokeObjectURL(state.currentVideoUrl);
                    state.currentVideoUrl = null;

                videoEl.srcObject = null;

            function handleHostFileSelection(file) {
                if (state.role !== 'host' || !file) return;

                // Validação estrita de tamanho máximo: 5 GB
                if (file.size > MAX_FILE_SIZE_BYTES) {
                    const sizeGB = (file.size / (1024 * 1024 * 1024)).toFixed(2);
                    showToast(
                        'Arquivo Excede o Limite de 5 GB',
                        `O arquivo selecionado possui ${sizeGB} GB. O limite máximo permitido nesta sala é de 5.00 GB.`,
                        'error'
                    );
                    videoFileInput.value = '';
                    return;
                }

                // Encerra player do YouTube caso estivesse ativo
                destroyYouTubePlayer();
                ytResultsDrawer.classList.add('hidden');

                if (state.currentVideoUrl) {
                    URL.revokeObjectURL(state.currentVideoUrl);
                }

                const objectUrl = URL.createObjectURL(file);
                state.mediaMode = 'local';
                state.youtubeVideoId = null;
                state.currentVideoUrl = objectUrl;
                state.currentFileName = file.name;
                state.currentFileSize = file.size;

                videoPlaceholder.classList.add('hidden');
                videoEl.classList.remove('hidden');
                customControls.classList.remove('hidden');
                activeMediaFooter.classList.remove('hidden');

                activeFileName.textContent = file.name;
                activeFileSize.textContent = formatBytes(file.size);
                syncModeText.textContent = 'Transmitindo para a Sala';

                videoEl.srcObject = null;
                videoEl.src = objectUrl;
                videoEl.load();
                updatePlayPauseUI(true);

                uploadBtnLabel.textContent = 'Trocar Vídeo';
                fileInfoText.innerHTML = `Arquivo ativo: <strong class="text-emerald-400">${escapeHtml(file.name)}</strong> (${formatBytes(file.size)})`;

                // Avisa os convidados sobre o novo vídeo e inicia o stream WebRTC
                broadcastToGuests({
                    type: 'VIDEO_LOADED',
                    fileName: file.name,
                    fileSize: file.size
                });

                videoEl.onloadeddata = () => {
                    streamVideoToAllGuests();
                };

                addSystemMessage(`Você carregou "${file.name}" (${formatBytes(file.size)}).`);
                showToast('Vídeo Pronto!', 'Dê Play para iniciar a sessão com todos os convidados.', 'success');
